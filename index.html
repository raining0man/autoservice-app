<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автосервис Админ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            padding: 16px;
            padding-bottom: 80px;
        }
        h1 { font-size: 20px; margin-bottom: 16px; text-align: center; }
        .section {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section h2 { font-size: 16px; margin-bottom: 12px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            font-size: 14px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 4px;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        .btn-primary {
            background: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #fff);
        }
        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            color: var(--tg-theme-text-color, #000);
            font-size: 14px;
            padding: 10px;
        }
        .btn-success { background: #28a745; color: #fff; }
        .btn-warning { background: #ffc107; color: #000; }

        .sub-section {
            background: rgba(0,0,0,0.04);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0 12px 0;
        }
        .sub-title {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .picker-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        .picker-btn {
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            border: 2px solid var(--tg-theme-hint-color, #ddd);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            font-weight: 400;
            margin: 0;
        }
        .picker-btn.active {
            border-color: var(--tg-theme-button-color, #2ea6ff);
            background: rgba(46, 166, 255, 0.1);
            font-weight: 600;
        }
        .picker-btn small {
            display: block;
            color: #888;
            font-size: 12px;
            font-weight: 400;
            margin-top: 2px;
        }

        .temp-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: var(--tg-theme-bg-color, #fff);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            gap: 8px;
        }
        .temp-item span { flex: 1; }
        .temp-item button {
            width: auto;
            padding: 4px 8px;
            font-size: 12px;
            margin: 0;
            background: #dc3545;
            color: #fff;
        }

        .card {
            border: 1px solid var(--tg-theme-hint-color, #eee);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            gap: 6px;
        }
        .card-header strong { font-size: 14px; }
        .card-header small { color: #888; font-size: 12px; display: block; }
        .card-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .btn-icon {
            width: auto;
            padding: 6px 8px;
            font-size: 14px;
            border-radius: 6px;
            margin: 0;
            background: #e0e0e0;
            color: #000;
        }
        .btn-icon.delete { background: #dc3545; color: #fff; }
        .btn-icon.edit { background: #ffc107; color: #000; }
        .btn-icon.save { background: #28a745; color: #fff; }

        .car-line {
            font-size: 12px;
            color: #666;
            padding: 2px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .car-line .car-info { flex: 1; }

        .order-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 3px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.06);
        }
        .order-row:last-child { border-bottom: none; }
        .order-row .label { color: #888; }
        .order-expenses {
            margin-top: 6px;
            padding: 6px 8px;
            background: rgba(0,0,0,0.03);
            border-radius: 6px;
            font-size: 12px;
        }
        .order-expenses .exp-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .order-total {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 2px solid rgba(0,0,0,0.08);
            font-size: 13px;
            font-weight: 600;
        }
        .order-total .profit { color: #28a745; }
        .order-total .loss { color: #dc3545; }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            background: #ffe4b5;
            color: #8b4513;
            margin-left: 4px;
        }
        .badge.overdue { background: #ffcccc; color: #a00; }
        .badge.today { background: #fff3cd; color: #856404; }
        .badge.ok { background: #d4edda; color: #155724; }

        .empty { text-align: center; color: #888; font-size: 14px; padding: 20px 0; }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-top: 1px solid #eee;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🔧 Автосервис Админ</h1>

    <div class="section">
        <h2>👤 Клиенты</h2>
        <input type="text" id="clientName" placeholder="ФИО клиента" />
        <input type="tel" id="clientPhone" placeholder="Телефон" />

        <div class="sub-section">
            <div class="sub-title">🚗 Автомобили клиента</div>
            <input type="text" id="carModel" placeholder="Марка, модель (напр. Toyota Camry)" />
            <input type="text" id="carPlate" placeholder="Гос. номер (необязательно)" />
            <button class="btn-secondary" onclick="addCarToList()">➕ Добавить авто</button>
            <div id="carsTempList"></div>
        </div>

        <button class="btn-primary" onclick="addClient()">Добавить клиента</button>
        <div id="clientsList"><div class="empty">Нет клиентов</div></div>
    </div>

    <div class="section">
        <h2>📋 Заказы</h2>

        <div class="sub-section">
            <div class="sub-title">1. Выберите клиента:</div>
            <div id="clientPicker" class="picker-list">
                <div class="empty">Сначала добавьте клиента</div>
            </div>
        </div>

        <div class="sub-section" id="carPickerSection" style="display:none;">
            <div class="sub-title">2. Выберите автомобиль:</div>
            <div id="carPicker" class="picker-list"></div>
        </div>

        <div id="orderFormSection" style="display:none;">
            <label>Описание работ:</label>
            <input type="text" id="orderWork" placeholder="Напр. Замена масла" />

            <label>Стоимость работ (руб.):</label>
            <input type="number" id="orderCost" placeholder="0" />

            <label>Срок выполнения:</label>
            <input type="date" id="orderDeadline" />

            <label>Предоплата (руб.):</label>
            <input type="number" id="orderPrepayment" placeholder="0" />

            <div class="sub-section">
                <div class="sub-title">💸 Расходы по работе</div>
                <input type="text" id="expenseDesc" placeholder="Напр. Масло Mobil 1" />
                <input type="number" id="expenseAmount" placeholder="Сумма (руб.)" />
                <button class="btn-secondary" onclick="addExpenseToList()">➕ Добавить расход</button>
                <div id="expensesTempList"></div>
            </div>

            <button class="btn-primary" onclick="addOrder()">Добавить заказ</button>
        </div>

        <div id="ordersList"><div class="empty">Нет заказов</div></div>
    </div>

    <div class="section">
        <h2>🔄 Синхронизация</h2>
        <p style="font-size:13px; margin-bottom:12px; color:#888;">
            Сохраните данные в Telegram, чтобы открыть их на другом устройстве.
        </p>
        <button class="btn-success" onclick="saveToTelegram()">💾 Сохранить в Telegram</button>
        <button class="btn-warning" onclick="loadFromTelegram()">📥 Загрузить из Telegram</button>
        <button class="btn-secondary" onclick="clearAll()">🗑 Очистить всё</button>
    </div>

    <div class="status-bar">
        <span id="statusText">Готово</span>
        <span id="versionText">v5.0</span>
    </div>

    <script src="app.js?v=6"></script>
</body>
</html>
